[package]
name = "display-tester"
version = "0.1.0"
description = "ระบบทดสอบจอภาพและจอสัมผัส (Display & Touch Tester)"
authors = ["Best"]
edition = "2021"

[lib]
name = "display_tester_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
